<!DOCTYPE html>

  <!-- Folha de estilo externa (caminho relativo: funciona no GitHub Pages) -->

        <li><a href="#sobre">Sobre mim</a></li>

  <main>

      <h2>Sobre mim</h2>

    </section>

  <footer class="rodape">
    <p>© 2026 Davi Bento · Feito com HTML, CSS e JavaScript.</p>
  </footer>

  <!-- JavaScript no fim do body: os elementos já existem quando ele roda -->
  <script src="js/script.js"></script>
